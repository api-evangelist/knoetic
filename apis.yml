aid: knoetic
name: Knoetic
description: 'Knoetic is an HR technology company that operates CPOHQ, a platform built for Chief
  People Officers and senior people-function executives. The product combines three surfaces: a
  private, invite-only community of 3,000+ Chief People Officers (one member per company) who exchange
  confidential playbooks and benchmarks; an AI "Chief of Staff" that delivers personalized morning
  briefings and monitors market and talent trends; and a suite of workflow-specific AI agents for
  people analytics, performance insight, and peer benchmarking across the people function. The company
  was founded as Knoetic around a people-analytics product and has since consolidated its public brand
  on CPOHQ — knoetic.com now redirects to cpohq.com, while the customer application remains at
  app.knoetic.com. Knoetic has raised $50M+ from Accel, EQT Ventures, Menlo Ventures and angel
  investors. As of this enrichment pass Knoetic publishes no public API, developer portal, SDKs, or
  API documentation; the platform is a closed B2B SaaS offering sold to enterprise people teams. It
  does publish a Vanta-hosted trust center and displays a SOC 2 Type II attestation.'
